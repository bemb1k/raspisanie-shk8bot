name: Проверка расписания

on:
  schedule:
    # Проверка каждые 5 минут с 16:00 до 20:55 по Москве, понедельник–суббота.
    - cron: "*/5 16-20 * * 1-6"
      timezone: "Europe/Moscow"
    # Последняя проверка дня в 21:00 по Москве.
    - cron: "0 21 * * 1-6"
      timezone: "Europe/Moscow"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raspisanie-shk8bot
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить библиотеки
        run: python -m pip install -r requirements.txt

      - name: Проверить страницу и отправить расписание
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          IS_FINAL_CHECK: ${{ github.event.schedule == '0 21 * * 1-6' }}
        run: python bot.py

      - name: Сохранить состояние бота
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Состояние не изменилось."
            exit 0
          fi
          git commit -m "Обновить состояние бота расписания"
          git push
